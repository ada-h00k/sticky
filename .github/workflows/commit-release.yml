name: Build and publish commit releases

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch })
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Stage binary
        run: |
          install -Dm755 target/release/sticky "dist/sticky-linux-${{ matrix.arch }"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sticky-linux-${{ matrix.arch }
          path: dist/sticky-linux-${{ matrix.arch }
          if-no-files-found: error

  release:
    name: Publish commit release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }
          TAG: commit-${{ github.sha }
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }" \
            --title "Build ${GITHUB_SHA::12}" \
            --notes "Automated binaries for commit $GITHUB_SHA." \
            --prerelease
